name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      # Exercise the minimum supported Git version on both platforms.
      - uses: actions/checkout@v4
        with:
          repository: git/git
          ref: v2.48.0
          path: .git-source
      - name: Build Git 2.48
        working-directory: .git-source
        run: |
          make -j2 NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_CURL=YesPlease NO_EXPAT=YesPlease NO_OPENSSL=YesPlease prefix="$RUNNER_TEMP/git" install
          echo "$RUNNER_TEMP/git/bin" >> "$GITHUB_PATH"
      - run: git --version
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/git-retime
